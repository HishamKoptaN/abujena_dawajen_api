name: Production Deployment

on:
  push:
    branches:
      - prod
env:
  FRESH_MIGRATE: ${{ secrets.FRESH_MIGRATE }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: muein.online
          username: ai7cxrcwv7u0
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ai7cxrcwv7u0/public_html/api
            /usr/local/bin/php artisan migrate:fresh-all
            git fetch origin prod
            git reset --hard origin/prod
            cp .env.prod .env
            rm -rf database/seeders/*
            rm -rf database/factories/*
            /usr/local/bin/php /usr/local/bin/composer dump-autoload --no-dev --optimize
            /usr/local/bin/php artisan config:cache
            /usr/local/bin/php artisan route:cache
            /usr/local/bin/php artisan view:cache
            echo "Deployment Successful at $(date)"
